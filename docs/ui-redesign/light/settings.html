<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浅色主题 · 设置弹窗</title>
<link rel="stylesheet" href="light.css">
<style>
  body.settings { display: block; position: relative; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .ghost { position: absolute; inset: 0; width: 1480px; height: 940px; border: 0; filter: blur(4px) saturate(0.97) brightness(0.9); }
  .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); }

  .modal {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 880px; height: 600px;
    display: flex; overflow: hidden;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 40px 90px -32px rgba(15, 17, 21, 0.45), 0 2px 8px rgba(15, 17, 21, 0.08);
  }

  .modal-nav {
    width: 208px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 14px 10px 12px;
  }
  .nav-title { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-size: 12px; font-weight: 600; color: var(--text2); }
  .nav-title .i { width: 15px; height: 15px; color: var(--muted); }
  .nav-item { height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 7px; color: var(--text2); font-size: 12px; white-space: nowrap; }
  .nav-item .i { width: 15px; height: 15px; color: var(--muted); }
  .nav-item.on { background: var(--accent); color: #FFFFFF; font-weight: 500; }
  .nav-item.on .i { color: #FFFFFF; }
  .nav-div { height: 1px; background: var(--border); margin: 9px 8px; }
  .nav-sp { flex: 1; }

  .modal-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); }
  .pane-head { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .pane-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .pane-head p { margin: 5px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  .pane-body { flex: 1; min-height: 0; padding: 16px 22px 20px; display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .toolbar .count { font-size: 11px; color: var(--muted); }
  .toolbar .count b { color: var(--text2); font-weight: 600; }

  .model-row {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 9px;
    box-shadow: var(--shadow-card);
    margin-bottom: 9px;
  }
  .model-icon { width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; border: 1px solid var(--border); }
  .model-icon .i { width: 16px; height: 16px; }
  .model-main { flex: 1; min-width: 0; }
  .model-name { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .model-sub { margin-top: 3px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .model-sub .dot { margin: 0 5px; opacity: 0.55; }
  .model-acts { display: flex; align-items: center; gap: 2px; flex: none; }
  .model-acts .icon-btn { width: 26px; height: 26px; }
  .model-acts .icon-btn .i { width: 14px; height: 14px; color: var(--muted); }

  .hint { margin-top: auto; display: flex; align-items: flex-start; gap: 8px; padding: 11px 13px; border-radius: 8px; background: var(--panel); border: 1px dashed var(--border2); font-size: 10.5px; color: var(--muted); line-height: 1.6; }
  .hint .i { width: 13px; height: 13px; margin-top: 1px; flex: none; }
</style>
</head>
<body class="settings">
<script src="../concepts/icons.js"></script>
<script src="icons-extra.js"></script>

<div class="scene">
  <iframe class="ghost" src="main-config.html" scrolling="no" tabindex="-1"></iframe>
  <div class="scrim"></div>

  <div class="modal">
    <aside class="modal-nav">
      <div class="nav-title"><svg class="i"><use href="#i-settings"/></svg>设置</div>
      <div class="nav-item"><svg class="i"><use href="#i-palette"/></svg>外观</div>
      <div class="nav-item on"><svg class="i"><use href="#i-cpu"/></svg>AI 生成模型</div>
      <div class="nav-item"><svg class="i"><use href="#i-target"/></svg>向量模型</div>
      <div class="nav-item"><svg class="i"><use href="#i-sliders"/></svg>预设</div>
      <div class="nav-item"><svg class="i"><use href="#i-globe"/></svg>网络代理</div>
      <div class="nav-item"><svg class="i"><use href="#i-file"/></svg>编辑器</div>
      <div class="nav-item"><svg class="i"><use href="#i-message"/></svg>提示词模板</div>
      <div class="nav-item"><svg class="i"><use href="#i-book-open"/></svg>写作 Skills</div>
      <div class="nav-item"><svg class="i"><use href="#i-columns"/></svg>MCP 服务器</div>
      <div class="nav-div"></div>
      <div class="nav-item"><svg class="i"><use href="#i-info"/></svg>关于</div>
      <div class="nav-sp"></div>
    </aside>

    <section class="modal-pane">
      <header class="pane-head">
        <div>
          <h2>AI 生成模型</h2>
          <p>配置用于正文生成、改写与摘要的语言模型，渠道与模型参数分离管理</p>
        </div>
        <button class="icon-btn"><svg class="i"><use href="#i-x"/></svg></button>
      </header>

      <div class="pane-body">
        <div class="toolbar">
          <span class="count">已配置 <b>2</b> 个生成模型</span>
          <button class="btn btn-primary btn-sm"><svg class="i"><use href="#i-plus"/></svg>添加生成模型</button>
        </div>

        <div class="model-row">
          <div class="model-icon"><svg class="i"><use href="#i-cpu"/></svg></div>
          <div class="model-main">
            <div class="model-name">Qwen3 14B Abliterated Novel Q4<span class="tag accent">默认</span></div>
            <div class="model-sub">custom<span class="dot">·</span>qwen3-14b-abliterated-novel-q4<span class="dot">·</span>http://127.0.0.1:11434/v1</div>
          </div>
          <div class="model-acts">
            <button class="icon-btn"><svg class="i"><use href="#i-pen"/></svg></button>
            <button class="icon-btn"><svg class="i"><use href="#i-more"/></svg></button>
          </div>
        </div>

        <div class="model-row">
          <div class="model-icon"><svg class="i"><use href="#i-cpu"/></svg></div>
          <div class="model-main">
            <div class="model-name">Grok</div>
            <div class="model-sub">custom<span class="dot">·</span>grok-4.3<span class="dot">·</span>https://api.x.ai/v1</div>
          </div>
          <div class="model-acts">
            <button class="icon-btn"><svg class="i"><use href="#i-pen"/></svg></button>
            <button class="icon-btn"><svg class="i"><use href="#i-more"/></svg></button>
          </div>
        </div>

        <div class="hint">
          <svg class="i"><use href="#i-info"/></svg>
          <span>所有修改即时保存到本机，无需手动确认。模型采样参数在「预设」中按创作环节独立调度。</span>
        </div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
