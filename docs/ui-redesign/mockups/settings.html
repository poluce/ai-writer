<!doctype html>
<html lang="zh-CN" data-dir="paper">
<head>
<meta charset="utf-8">
<title>AI Writer 界面设计稿 · 设置弹窗</title>
<script>document.documentElement.dataset.dir = new URLSearchParams(location.search).get('dir') || 'paper'</script>
<link rel="stylesheet" href="mockup.css">
<style>
  body.settings { display: block; position: relative; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .ghost { position: absolute; inset: 0; width: 1480px; height: 940px; border: 0; filter: blur(2.5px) saturate(0.96) brightness(0.97); }
  html[data-dir='dark'] .ghost { filter: blur(2.5px) saturate(0.9) brightness(0.78); }
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  html[data-dir='paper'] .scrim { --scrim: rgba(58, 46, 30, 0.34); }
  html[data-dir='neutral'] .scrim { --scrim: rgba(15, 20, 28, 0.32); }
  html[data-dir='dark'] .scrim { --scrim: rgba(0, 0, 0, 0.58); }

  .modal {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 964px; height: 604px;
    display: flex;
    overflow: hidden;
    border-radius: var(--modal-radius, 13px);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--modal-shadow);
  }
  html[data-dir='paper'] .modal {
    --modal-radius: 13px;
    --modal-shadow: 0 40px 90px -30px rgba(40, 30, 18, 0.55), 0 2px 8px rgba(40, 30, 18, 0.08);
  }
  html[data-dir='neutral'] .modal {
    --modal-radius: 10px;
    --modal-shadow: 0 32px 72px -28px rgba(10, 16, 30, 0.45), 0 1px 4px rgba(10, 16, 30, 0.1);
  }
  html[data-dir='dark'] .modal {
    --modal-radius: 11px;
    --modal-shadow: 0 48px 100px -24px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  /* 左侧导航 */
  .modal-nav {
    width: 218px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 14px 10px 12px;
  }
  .nav-title {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px 14px;
    font-size: 12.5px; font-weight: 600; color: var(--text);
    letter-spacing: 0.02em;
  }
  .nav-title .i { width: 15px; height: 15px; color: var(--muted); }
  .nav-item {
    height: 38px;
    display: flex; align-items: center; gap: 9px;
    padding: 0 10px;
    border-radius: 7px;
    color: var(--text2);
    font-size: 12.5px;
    position: relative;
    white-space: nowrap;
  }
  .nav-item .i { width: 15px; height: 15px; color: var(--muted); }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 500;
  }
  .nav-item.active .i { color: var(--accent); }
  .nav-divider { height: 1px; background: var(--line); margin: 10px 8px; }
  .nav-spacer { flex: 1; }
  html[data-dir='neutral'] .modal-nav { width: 206px; padding: 12px 10px; }
  html[data-dir='neutral'] .nav-item { height: 34px; font-size: 12px; }
  html[data-dir='neutral'] .nav-title { font-size: 12px; padding-bottom: 12px; }

  /* 右侧内容 */
  .modal-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); }
  .pane-head {
    flex: none;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line);
  }
  .pane-head h2 {
    margin: 0;
    font-family: var(--font-head);
    font-size: 16.5px; font-weight: 600; color: var(--text);
    letter-spacing: 0.01em;
  }
  html[data-dir='neutral'] .pane-head h2,
  html[data-dir='dark'] .pane-head h2 { font-size: 15px; letter-spacing: 0; }
  .pane-head p { margin: 5px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .pane-body { flex: 1; min-height: 0; padding: 18px 24px 24px; display: flex; flex-direction: column; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin-bottom: 14px;
  }
  .toolbar .count { font-size: 11.5px; color: var(--muted); }
  .toolbar .count b { font-weight: 600; color: var(--text2); }

  .model {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line2);
    border-radius: 9px;
    background: var(--field-bg);
    margin-bottom: 10px;
    box-shadow: var(--shadow-card);
  }
  html[data-dir='neutral'] .model { border-radius: 7px; background: var(--card); box-shadow: none; }
  html[data-dir='dark'] .model { border-radius: 8px; background: #14171C; }
  .model-icon {
    width: 34px; height: 34px; flex: none;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent-text);
    display: grid; place-items: center;
    border: 1px solid var(--line);
  }
  .model-icon .i { width: 17px; height: 17px; stroke-width: 1.6; }
  .model-main { flex: 1; min-width: 0; }
  .model-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text); }
  .tag-default {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em;
    padding: 2px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-text);
    border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .model-sub {
    margin-top: 3px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-sub .dot { margin: 0 6px; opacity: 0.55; }
  .model-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .model-actions .icon-only { width: 26px; height: 26px; }
  .model-actions .icon-only .i { width: 14px; height: 14px; color: var(--muted); }

  .hint {
    margin-top: auto;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--field-bg-alt);
    border: 1px dashed var(--line2);
    font-size: 11px; color: var(--muted); line-height: 1.6;
  }
  .hint .i { width: 14px; height: 14px; margin-top: 1px; flex: none; color: var(--muted); }
</style>
</head>
<body class="settings">
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.04Z"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v2.5M15 2v2.5M9 19.5V22M15 19.5V22M2 9h2.5M2 15h2.5M19.5 9H22M19.5 15H22"/></symbol>

    <symbol id="i-about" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="0.8" fill="currentColor" stroke="none"/></symbol>

</svg>

<div class="scene">
  <iframe class="ghost" id="ghost" src="mockup.html?dir=paper" scrolling="no" tabindex="-1"></iframe>
  <div class="scrim"></div>

  <div class="modal">
    <aside class="modal-nav">
      <div class="nav-title"><svg class="i"><use href="#i-set"/></svg>设置</div>
      <div class="nav-item"><svg class="i"><use href="#i-palette"/></svg>外观</div>
      <div class="nav-item active"><svg class="i"><use href="#i-cpu"/></svg>AI 生成模型</div>
      <div class="nav-item"><svg class="i"><use href="#i-vector"/></svg>向量模型</div>
      <div class="nav-item"><svg class="i"><use href="#i-sliders"/></svg>预设</div>
      <div class="nav-item"><svg class="i"><use href="#i-proxy"/></svg>网络代理</div>
      <div class="nav-item"><svg class="i"><use href="#i-editor"/></svg>编辑器</div>
      <div class="nav-item"><svg class="i"><use href="#i-prompt"/></svg>提示词模板</div>
      <div class="nav-item"><svg class="i"><use href="#i-bookmark"/></svg>写作 Skills</div>
      <div class="nav-item"><svg class="i"><use href="#i-server"/></svg>MCP 服务器</div>
      <div class="nav-divider"></div>
      <div class="nav-item"><svg class="i"><use href="#i-about"/></svg>关于</div>
    </aside>

    <section class="modal-pane">
      <header class="pane-head">
        <div>
          <h2>AI 生成模型</h2>
          <p>配置用于正文生成、改写与摘要的语言模型，渠道与模型参数分离管理</p>
        </div>
        <button class="icon-only" aria-label="关闭"><svg class="i"><use href="#i-x"/></svg></button>
      </header>

      <div class="pane-body">
        <div class="toolbar">
          <span class="count">已配置 <b>2</b> 个生成模型</span>
          <button class="btn btn-primary btn-sm"><svg class="i"><use href="#i-plus"/></svg>添加生成模型</button>
        </div>

        <div class="model">
          <div class="model-icon"><svg class="i"><use href="#i-cpu"/></svg></div>
          <div class="model-main">
            <div class="model-name">Qwen3 14B Abliterated Novel Q4<span class="tag-default">默认</span></div>
            <div class="model-sub">custom<span class="dot">·</span>qwen3-14b-abliterated-novel-q4<span class="dot">·</span>http://127.0.0.1:11434/v1</div>
          </div>
          <div class="model-actions">
            <button class="icon-only" aria-label="编辑"><svg class="i"><use href="#i-edit"/></svg></button>
            <button class="icon-only" aria-label="更多"><svg class="i"><use href="#i-more"/></svg></button>
          </div>
        </div>

        <div class="model">
          <div class="model-icon"><svg class="i"><use href="#i-cpu"/></svg></div>
          <div class="model-main">
            <div class="model-name">Grok</div>
            <div class="model-sub">custom<span class="dot">·</span>grok-4.3<span class="dot">·</span>https://api.x.ai/v1</div>
          </div>
          <div class="model-actions">
            <button class="icon-only" aria-label="编辑"><svg class="i"><use href="#i-edit"/></svg></button>
            <button class="icon-only" aria-label="更多"><svg class="i"><use href="#i-more"/></svg></button>
          </div>
        </div>

        <div class="hint">
          <svg class="i"><use href="#i-info"/></svg>
          <span>所有修改即时保存到本机，无需手动确认。模型采样参数在「预设」中按创作环节独立调度。</span>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  const dir = new URLSearchParams(location.search).get('dir') || 'paper'
  document.getElementById('ghost').src = 'mockup.html?dir=' + encodeURIComponent(dir)
</script>
</body>
</html>
